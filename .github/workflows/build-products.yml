name: Build products

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-products.yml'
      - 'build.sh'
      - 'Makefile'
      - 'requirements-build.txt'
      - 'containers/**'
      - 'config/**'
      - 'sources.lock.json'
      - '.gitmodules'
      - 'patches/**'
      - 'uefi/**'
      - 'vendor/piano/**'
      - 'vendor/piano-linux/**'
      - 'linux/**'
      - 'tools/**'
      - 'upstream/**'
      - 'android/**'
      - 'docs/user/install-from-artifact.md'
  workflow_dispatch:
    inputs:
      target:
        description: Product to build
        type: choice
        options: [uefi, linux, debian-gnome, debian-kde, steamos]
        default: debian-gnome

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      has_build: ${{ steps.targets.outputs.has_build }}
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - id: targets
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          MANUAL_TARGET: ${{ inputs.target }}
        run: python3 tools/ci_build_targets.py
  build:
    needs: select
    if: needs.select.outputs.has_build == 'true'
    concurrency:
      group: build-products-${{ github.ref }}-${{ matrix.target }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    env:
      # TARGET is reserved by Cargo/bindgen for the compiler target triple.
      SUNUEFI_BUILD_TARGET: ${{ matrix.target }}
    runs-on: ${{ (startsWith(matrix.target, 'debian-') || matrix.target == 'steamos') && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: false
          persist-credentials: false
      - name: Get only required fixed sources
        run: ./build.sh sources
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/ccache
          key: ccache-${{ runner.arch }}-${{ env.SUNUEFI_BUILD_TARGET }}-${{ hashFiles('sources.lock.json', 'patches/**', 'config/build-container.json') }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.arch }}-${{ env.SUNUEFI_BUILD_TARGET }}-${{ hashFiles('sources.lock.json', 'patches/**', 'config/build-container.json') }}-
      - name: Build the pinned-base environment
        run: python3 tools/build_container.py
      - name: Build selected product
        run: |
          set -o pipefail
          mkdir -p build/logs build/ccache
          docker run --rm --privileged \
            -v "$PWD:/workspace" -w /workspace \
            -e CCACHE_DIR=/workspace/build/ccache -e CCACHE_MAXSIZE=3G \
            -e SUNUEFI_BUILD_TARGET sunuefi-builder bash -euc '
              git config --global --add safe.directory /workspace
              git config --global --add safe.directory "/workspace/*"
              python3 -m venv .venv
              .venv/bin/pip install -r requirements-build.txt
              . .venv/bin/activate
              case "$SUNUEFI_BUILD_TARGET" in
                uefi)
                  ./build.sh uefi
                  ./build.sh module
                  ./build.sh installer --product artifacts/product/PianoUEFI-product.img
                  ;;
                linux)
                  ./build.sh linux
                  ;;
                steamos)
                  ./build.sh uefi
                  ./build.sh module
                  ./build.sh linux
                  ./build.sh steamos-rootfs
                  ./build.sh package \
                    --rootfs build/distros/steamos-piano/rootfs \
                    --rootfs-manifest build/distros/steamos-piano/manifest.json \
                    --initramfs build/distros/steamos-piano/initramfs/initramfs.cpio.gz \
                    --root-size-mib 16384
                  python3 tools/package_sparse_images.py --bundle artifacts/release-7.2.9 --output artifacts/fastboot-sparse
                  ./build.sh installer --bundle artifacts/release-7.2.9
                  mkdir -p artifacts/rootfs/bundle
                  mv artifacts/installer/bundle/root.ext4.img artifacts/rootfs/bundle/
                  ;;
                debian-gnome|debian-kde)
                  python3 -c "import sys; sys.path.insert(0, \"tools\"); from build_release_rootfs import require_host; require_host()"
                  ./build.sh uefi
                  ./build.sh module
                  ./build.sh linux
                  ./build.sh mesa
                  ./build.sh sensors
                  ./build.sh ffmpeg --install-dependencies
                  ./build.sh release-rootfs --desktop "${SUNUEFI_BUILD_TARGET#debian-}"
                  ./build.sh package --root-size-mib 8192
                  python3 tools/package_sparse_images.py --bundle artifacts/release-7.2.9 --output artifacts/fastboot-sparse
                  ./build.sh installer --bundle artifacts/release-7.2.9
                  mkdir -p artifacts/rootfs/bundle
                  mv artifacts/installer/bundle/root.ext4.img artifacts/rootfs/bundle/
                  ;;
              esac
            ' 2>&1 | tee build/logs/ci-build.log
      - name: Show failed build output
        if: failure()
        run: |
          if [ -f build/logs/ci-build.log ]; then
            tail -n 160 build/logs/ci-build.log
          fi
          for log in build/distros/release-7.2.9.build.log build/ffmpeg/build.log build/gsd/build.log build/mutter/build.log; do
            if [ -f "$log" ]; then
              echo "::group::$log"
              tail -n 100 "$log"
              echo "::endgroup::"
            fi
          done
      - name: Prepare standalone UEFI notices
        if: matrix.target != 'linux'
        run: |
          sudo install -D -m 0644 \
            uefi/components/product-support/Library/ConsoleScale/OFL.txt \
            artifacts/product/licenses/OFL.PianoSetupFont.txt
      - name: Standalone UEFI for fastboot boot
        if: matrix.target != 'linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: SunUEFI-UEFI-Fastboot(MembootTest)-${{ matrix.target }}-${{ github.sha }}
          path: |
            artifacts/product/PianoUEFI-product.img
            artifacts/product/manifest.json
            artifacts/product/licenses/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: ESP image and one-click installer
        if: matrix.target != 'linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: SunUEFI-${{ matrix.target != 'uefi' && format('ESP-{0}', matrix.target) || 'UEFI' }}-${{ github.sha }}
          path: artifacts/installer/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Downloadable Android boot assistant module
        if: matrix.target != 'linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: SunUEFI-Android-Module-${{ matrix.target }}-${{ github.sha }}
          path: artifacts/android/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Root filesystem image
        if: startsWith(matrix.target, 'debian-') || matrix.target == 'steamos'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: SunUEFI-Root-${{ matrix.target }}-${{ github.sha }}
          path: artifacts/rootfs/
          if-no-files-found: error
          retention-days: 7
          compression-level: 1
      - name: Sparse ESP and root for factory Fastboot
        if: startsWith(matrix.target, 'debian-') || matrix.target == 'steamos'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: SunUEFI-Fastboot-Sparse-${{ matrix.target }}-${{ github.sha }}
          path: artifacts/fastboot-sparse/
          if-no-files-found: error
          retention-days: 7
          compression-level: 1
      - name: Downloadable Linux Image, config and matching modules
        if: matrix.target == 'linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: piano-linux-${{ github.sha }}
          path: artifacts/kernels/release-7.2.9/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Keep build records and kernel outputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: piano-build-records-${{ env.SUNUEFI_BUILD_TARGET }}-${{ github.sha }}
          path: |
            build/logs/
            sources.lock.json
            config/release.json
            config/steamos.json
            build/steamos-base/SOURCE.json
            build/distros/steamos-piano/manifest.json
            build/distros/steamos-piano/packages.tsv
            build/distros/steamos-piano/packages/ffmpeg/SOURCE.json
            linux/bsp/manifest.json
            linux/dts/piano-cpu-model.dtso
            linux/dts/piano-audio-dmic-clock.dtso
            build/release-7.2.9/source-manifest.json
            build/mesa/SHA256SUMS
            build/sensors/SOURCE
            build/sensors/SHA256SUMS
            build/sensors/runtime/
            build/ffmpeg/SOURCE.json
            build/ffmpeg/SHA256SUMS
            build/ffmpeg/build.log
            build/distros/release-7.2.9/manifest.json
            build/distros/release-7.2.9.build.log
            build/distros/release-7.2.9/FAILED.json
            build/gsd/SOURCE.json
            build/gsd/build.log
            build/gsd/runtime/
            build/mutter/SOURCE.json
            build/mutter/runtime/
            build/mutter/SHA256SUMS
            build/mutter/build.log
            build/distros/release-7.2.9/packages.tsv
            build/distros/release-7.2.9/adapters/manifest.json
            build/distros/release-7.2.9/runtime/manifest.json
            artifacts/android/manifest.json
            build/android-product-module/manifest.json
            artifacts/product/manifest.json
            artifacts/kernels/release-7.2.9/Image
            artifacts/kernels/release-7.2.9/config
            artifacts/kernels/release-7.2.9/manifest.json
            artifacts/release-7.2.9/manifest.json
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
